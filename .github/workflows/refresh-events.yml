name: Refresh Mount Maunganui events

on:
  schedule:
    # Every Sunday at 15:00 UTC = Monday 4am New Zealand time
    - cron: "0 15 * * 0"
  workflow_dispatch: {}   # lets you press "Run workflow" to refresh on demand

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Pull this week's events
        run: python3 refresh_events.py

      - name: Save the new list
        run: |
          git config user.name "pacific-signage-bot"
          git config user.email "signage-bot@users.noreply.github.com"
          git add events.json last_checked.txt
          git commit -m "Weekly events refresh" || echo "Nothing new to save"
          git push
